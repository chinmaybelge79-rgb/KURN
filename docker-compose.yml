services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kurn
    ports:
      - "55432:5432"
    volumes:
      - kurn-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kurn"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  kurn-postgres:
